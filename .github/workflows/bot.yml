name: CRM Bot Reports

on:
  schedule:
    - cron: "0 9 * * *"   # щодня о 9:00
    - cron: "0 18 * * *"  # щодня о 18:00
  workflow_dispatch:       # дозволяє запускати вручну

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tasks report
        run: python tasks_report.py

      - name: Run invoices report
        run: python invoices_report.py
